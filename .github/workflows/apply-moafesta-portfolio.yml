name: Apply Moafesta portfolio presentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-moafesta-portfolio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('moafesta-prototype/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./presentation-standard.js"></script>'
          if tag not in s:
              s=s.replace('</head>',tag+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add moafesta-prototype/index.html
          git diff --cached --quiet || git commit -m "Apply Moafesta portfolio presentation mode"
          git push
